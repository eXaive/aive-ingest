# ═══════════════════════════════════════════════════════════════════════════
# MCP listing collection — THREE METHODS, one POST each per current-spec
# endpoint: tools/list, then resources/list, then prompts/list.
#
# Sends exactly one JSON-RPC request per endpoint PER METHOD, plus one per extra
# cursor page:
#   {"jsonrpc":"2.0","id":1,"method":"<method>","params":{"_meta":{…}}}
# `params` is REQUIRED on a PaginatedRequest (schema.ts:1063-1065) and `_meta`
# is required inside it; `cursor` is added only on follow-up pages. NO
# initialize handshake, NO Mcp-Session-Id sent or read, NO Authorization, no
# cookies.
#
# NO tools/call, NO resources/read, NO prompts/get. All three workers read
# DECLARATIONS and stop at the declaration: tools/list returns schemas,
# resources/list returns URIs and MIME types (never contents), prompts/list
# returns declared arguments (never rendered text). A listing is not an access.
#
# RESOURCES AND PROMPTS HAVE NEVER BEEN DIALLED. Not once, not bounded, not
# locally. They were built against fixtures only; the DB-level checks ran inside
# a transaction that rolled back. The 08:00Z cron is the FIRST time either
# method reaches a real endpoint. tools/list, by contrast, has run before -- see
# the run history below.
#
# THE DISCLOSURE AMENDMENT THAT GATED THEM: aive-platform cc4684d, live and
# verified (200, no redirect chain). It states a CLOSED SET OF FOUR methods,
# renders all four User-Agent strings, and -- because the collectors did not
# exist when it shipped -- says in terms that resources/list and prompts/list
# were not yet in service. That note is what this run makes stale, and deleting
# it is the follow-up to the first green run here.
#
# THREE METHODS MEANS THREE AGENTS, not one shared string. An operator grepping
# their log sees AIVE-MCP-Tools, AIVE-MCP-Resources or AIVE-MCP-Prompts and
# knows which method reached them without reading anything. All three are
# rendered on the census page and their bytes are asserted against it in
# scripts/verify-list-collectors.ts.
#
# TARGET SET is the endpoints whose latest discover row in the reference sweep
# says discover_status='ok' — 360 URLs of 11,109 probed. session_required is a
# DIFFERENT status and is therefore excluded by construction rather than by a
# filter that could be forgotten; the worker asserts it at startup anyway,
# because the disclosure page promises it.
#
# CRON 08:00Z, and the slot is load-bearing in one direction: it must run AFTER
# the discover sweep whose rows define this worker's target set.
#
# MEASURED, NOT ASSUMED — corrected 2026-08-12. This header previously derived
# the slot from "discover starts at 03:00Z with a 150-minute worker deadline and
# a 180-minute job timeout, so it can still be writing at 06:00Z". Both halves
# were wrong, in opposite directions, and the conclusion survived only by luck.
# What the last runs actually did:
#
#   run 31564082139  schedule  started 04:41Z  finished 04:59Z   17m48s
#   run 31457744958  schedule  started 04:12Z  finished 04:14Z    2m15s  (failed)
#   run 31487138167  dispatch  started 11:33Z  finished 11:46Z   13m08s
#
#   - THE CRON DOES NOT FIRE AT 03:00Z. GitHub delivered '0 3 * * *' at 04:41Z
#     and at 04:12Z: 72 to 101 minutes late. Scheduled workflows are best-effort
#     and delay of this size is normal on a metered account.
#   - THE RUN IS NOT 150 MINUTES. It takes about 18. The 150-minute worker
#     deadline is a ceiling that has never been approached, so the old estimate
#     was pessimistic by roughly 8x.
#
# So THE BINDING CONSTRAINT IS CRON JITTER, NOT RUN LENGTH. Worst observed
# discover completion is 04:59Z, which leaves about 3 hours of headroom before
# 08:00Z. For this collector to overtake discover, discover would have to still
# be running at 08:00Z -- i.e. start after ~07:42Z, a delay of 4h42m against the
# 72-101min observed. The margin is roughly three hours beyond anything seen.
# The jitter is also symmetric: this workflow's own 08:00Z cron will arrive late
# by a similar amount, which pushes it FURTHER from discover, not closer.
#
#   ~04:12-04:41Z  discover sweep actually starts (cron fires late)
#   ~04:59Z        worst observed discover completion
#   05:00-06:15Z   the ingest block
#   07:00Z         reachability sweep (probe-mcp-endpoints.yml)
#   08:00Z         THIS -- ~3h clear of discover's worst observed completion,
#                  clear of the ingest block, after the reachability sweep
#
# Running this BEFORE the discover sweep would read yesterday's target set,
# which is not wrong so much as silently one day stale. The reachability
# ordering that matters to discover-mcp-servers.yml does not apply here: this
# worker writes mcp_tool_captures, never mcp_endpoint_probes, so it cannot
# re-base the published OBSERVED/BLOCK counts onto POST outcomes.
#
# IF THE JITTER EVER GROWS, this is the number to re-measure rather than a
# comment to trust: compare the newest finished discover run's finished_at
# against 08:00Z. The worker is not defenceless either -- it locates its target
# run by the most recent FINISHED scan_run containing discover rows, so an
# overlap degrades to reading yesterday's set rather than reading a half-written
# one.
#
# The target run is located by the same self-validating rule mcp_discover_census
# uses — the most recent FINISHED scan_run that actually contains discover rows
# inside its own window — so the 07:00Z HEAD sweep cannot be mistaken for the
# reference run even though it writes to the same table.
#
# OPERATOR EXCLUSIONS ARE HONOURED AND THE WORKER FAILS CLOSED. It loads
# public.mcp_exclusions once, after the target set is final and before any dial,
# and REFUSES TO RUN if that table is unreadable. A red run here can therefore
# mean "we could not confirm who asked us to stop", which is a deliberate
# outcome: skipping a day costs one day of coverage, while dialling an endpoint
# whose operator opted out breaks a commitment published at
# https://aive.global/mcp-trust/census and cannot be undone. Excluded endpoints
# still get a capture row with status='excluded', so they are reported as
# excluded rather than disappearing into a smaller denominator.
#
# Per-host adaptive pacing: HostScheduler is imported from
# discover-mcp-servers.ts and used UNMODIFIED — work queued per host,
# round-robin dispatch, per-host concurrency 1, and a 429 raises THAT HOST's gap
# and defers only that host.
#
# Exits non-zero on insert errors OR on a completed run that wrote ZERO
# captures — every outcome including every failure is a capture row, so zero
# captures means the write path never worked. The red Actions run IS the alert.
#
# Triggers: schedule + workflow_dispatch ONLY. No push, no pull_request, no
# pull_request_target — this is a PUBLIC repo and this workflow holds a database
# credential, so it must be unreachable from forks and from PR events.
#
# Required repo secret: AIVE_INGEST_DATABASE_URL (scoped aive_ingest role;
# pooler host aws-1-us-east-1, NOT aws-0 — aws-0 fails "Tenant or user not
# found"). No service role key. Nothing else.
# ═══════════════════════════════════════════════════════════════════════════
name: MCP Listing Collection (tools, resources, prompts)

# ─────────────────────────────────────────────────────────────────────────────
# ▶ SCHEDULE ON since 2026-08-12, after two preconditions were met, in order.
#
# 1. DISCLOSURE, which gated writing this worker at all. The census page
#    previously read "server/discover is the only method we issue"; issuing a
#    second method while that sentence was live would have made a published
#    commitment false for every operator who had already read it. The page was
#    amended FIRST (aive-platform d48d005, merged 7c110fc, verified live: 200,
#    no redirect, two-method sentence present) and carries this collector's
#    User-Agent verbatim. If a third method is ever added, the page changes
#    first, again.
#
# 2. THE EXCLUSION MECHANISM, which discover-mcp-servers.yml recorded as an
#    open gap when IT was enabled: "there is no exclusions table in the schema
#    and no skip path in this worker beyond deleted servers … Build it before
#    the first request arrives, not after one has been mishandled." It is built
#    (aive-platform 20260812000007, lib/mcp/exclusions.ts here), shared by both
#    collectors, and verified — 58 worker-side checks and 13 SQL-side checks.
#    No request has arrived yet. This is the "before" case.
#
# WHAT HAS ACTUALLY RUN, in order, so the corpus and an operator's access log can
# both be reconciled against this file rather than against a memory of it:
#
#   1. 2026-08-12  the first capture, a single deliberate local sweep, not from
#      this workflow: 360 attempted, 360 captures, 243 ok, 3,279 tools.
#   2. 2026-08-12  ONE BOUNDED DISPATCH of this workflow, tools_limit=10, to
#      smoke-test it end to end -- secret resolution, npm run collect:mcp-tools,
#      target-set location, the exclusion load, and the write path. 10 endpoints
#      dialled, 10 captures, 90 tools, 0 errors, 19s. Run 31647218145.
#   3. the 08:00Z cron is THE FIRST UNBOUNDED SCHEDULED RUN.
#   4. 2026-08-13  resources/list and prompts/list added as sequential steps in
#      THIS job. Neither has ever been dialled, by this workflow or otherwise,
#      and no dispatch precedes the cron for either. Their first contact with a
#      real endpoint is the same 08:00Z cron.
#
# An earlier version of this header said "No manual dispatch is fired ahead of
# the 08:00Z cron". That was true when written and the smoke test made it false,
# so it is corrected here rather than left to be believed. The reason the claim
# was made at all still stands and still shapes the choice: the disclosure page
# describes a once-daily rhythm, so the bounded run was capped at 10 endpoints
# instead of the full 358 precisely to keep the extra traffic negligible, and no
# further dispatch precedes the cron.
#
# TO PAUSE: re-comment the two `schedule`/`cron` lines. workflow_dispatch stays
# ACTIVE either way, so a bounded run is always available from the Actions tab
# (use the tools_limit input).
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      tools_limit:
        description: 'tools/list: cap endpoint count (smoke run). Empty = full target set.'
        required: false
        type: string
      resources_limit:
        description: 'resources/list: cap endpoint count (smoke run). Empty = full target set.'
        required: false
        type: string
      prompts_limit:
        description: 'prompts/list: cap endpoint count (smoke run). Empty = full target set.'
        required: false
        type: string
      skip_tools:
        description: 'tools/list: skip it entirely. Use when smoke-testing resources/list or prompts/list, so the bounded run does not append to the tools series.'
        required: false
        default: false
        type: boolean

concurrency:
  group: collect-mcp-tools
  cancel-in-progress: false

# Least privilege: this job reads the repo and nothing else. No packages, no
# id-token, no write scopes of any kind.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Sits ABOVE the SUM of the three workers' own deadlines
    # (TOOLS_/RESOURCES_/PROMPTS_DEADLINE_MINUTES, 60 each = 180) so every sweep
    # ends on its own terms and flushes its pending chunk, instead of being
    # killed by the runner with captures in hand. That margin is the whole point
    # of the gap: on 2026-08-11 a sweep died holding a 500-row chunk that had
    # already been probed, and the endpoints in it were dialled for nothing.
    #
    # Raised 90 -> 210 for the two added sweeps. The ceiling is not the
    # expectation: tools/list takes about 18 minutes over 360 endpoints and the
    # other two address the SAME 360, so ~55 minutes is the realistic figure and
    # 180 is a ceiling none of the three has approached.
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── THE THREE SWEEPS, IN ORDER, ISOLATED FROM EACH OTHER ────────────────
      #
      # continue-on-error on each collector is what makes them independent: a
      # prompts/list failure must not throw away a tools/list capture that
      # already succeeded and is already written. Without it, the first non-zero
      # exit ends the job and the remaining methods are never dialled -- so one
      # flaky method would silently cost coverage on the other two.
      #
      # `if: always()` on the second and third is the same rule stated the other
      # way: run even if an earlier step failed. continue-on-error alone would
      # already allow that, and both are present because they answer different
      # questions and a later edit could remove either.
      #
      # NO HOLLOW GREEN. continue-on-error would otherwise let the job report
      # success while a sweep failed, which is the exact failure mode the
      # zero-captures check inside each worker exists to prevent. The gate step
      # at the end re-reads all three outcomes and fails the job if any of them
      # failed, so the run is still RED and the alert still fires -- it just
      # fires after all three have had their turn.
      #
      # Order is load-bearing only in that tools/list runs first: it is the
      # method with a run history, so if the shared dispatch loop has regressed,
      # the failure shows up against the collector we have a baseline for.

      # SKIPPABLE, and only this one. The three collectors share a job, so a
      # bounded dispatch aimed at resources/list or prompts/list would otherwise
      # append a capture to the TOOLS series as a side effect of testing
      # something else -- measured on run #3, which added 1 tools capture while
      # proving the listing grants. Append-only means that row can never be
      # removed, so the fix is not to write it. On schedule the inputs context
      # is empty, so this evaluates true and the step runs exactly as before.
      - name: Collect tools/list
        id: tools
        if: inputs.skip_tools != true
        continue-on-error: true
        env:
          AIVE_INGEST_DATABASE_URL: ${{ secrets.AIVE_INGEST_DATABASE_URL }}
          TOOLS_LIMIT: ${{ inputs.tools_limit }}
          AIVE_TOOL_TRIGGER_KIND: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
          AIVE_TOOL_WORKFLOW_RUN_ID: ${{ github.run_id }}
          AIVE_TOOL_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          AIVE_TOOL_COLLECTOR_VERSION: ${{ github.sha }}
        run: npm run collect:mcp-tools

      - name: Collect resources/list
        id: resources
        continue-on-error: true
        if: always()
        env:
          AIVE_INGEST_DATABASE_URL: ${{ secrets.AIVE_INGEST_DATABASE_URL }}
          RESOURCES_LIMIT: ${{ inputs.resources_limit }}
        run: npm run collect:mcp-resources

      - name: Collect prompts/list
        id: prompts
        continue-on-error: true
        if: always()
        env:
          AIVE_INGEST_DATABASE_URL: ${{ secrets.AIVE_INGEST_DATABASE_URL }}
          PROMPTS_LIMIT: ${{ inputs.prompts_limit }}
        run: npm run collect:mcp-prompts

      # Re-imposes failure AFTER all three have run. Each outcome is printed so
      # the log says which method failed without opening three step panes.
      - name: Fail if any collector failed
        if: always()
        run: |
          echo "tools/list     : ${{ steps.tools.outcome }}"
          echo "resources/list : ${{ steps.resources.outcome }}"
          echo "prompts/list   : ${{ steps.prompts.outcome }}"
          failed=0
          [ "${{ steps.tools.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.resources.outcome }}" = "failure" ] && failed=1
          [ "${{ steps.prompts.outcome }}" = "failure" ] && failed=1
          if [ "$failed" = "1" ]; then
            echo "::error::at least one collector failed -- the other sweeps still ran and their captures are written"
            exit 1
          fi
          echo "all three collectors succeeded"
