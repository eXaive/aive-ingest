name: Broadcast Content Production V1
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Mock verification or authorized live Still production
        type: choice
        options: [mock, live]
        default: mock
        required: true
      grant_id:
        description: Exact Still-only grant UUID (required for live)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: broadcast-content-production-v1
  cancel-in-progress: false
jobs:
  mocked-contract:
    if: ${{ inputs.mode == 'mock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx lib/broadcast/contentProduction.test.ts
      - run: npx tsx lib/broadcast/stillProductionManual.test.ts
  live-still:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Advance one authorized Still
        env:
          AIVE_PRODUCTION_MODE: ${{ inputs.mode }}
          AIVE_PRODUCTION_GRANT_ID: ${{ inputs.grant_id }}
          AIVE_BROADCAST_PRODUCTION_MACHINE_SECRET: ${{ secrets.AIVE_BROADCAST_PRODUCTION_MACHINE_SECRET }}
        run: npx tsx workers/broadcast-still-production-manual.ts --live
