# ═══════════════════════════════════════════════════════════════════════════
# MCP Endpoint Probes — daily reachability scan of MCP remote endpoints.
#
# HEAD (GET on 405), 10s timeout, ≤2 redirects, concurrency 8, ≥100ms
# per-host gap, identifying User-Agent, no credentials, no MCP protocol
# negotiation. Deleted servers skipped; template-placeholder URLs recorded
# without a network call. Exits non-zero on run errors or a stale
# mcp_endpoint_probes stream (in-worker tripwire, PROBE_FRESHNESS_HOURS
# default 48). The red Actions run IS the alert.
#
# Triggers: schedule + workflow_dispatch ONLY. Never pull_request — this
# workflow holds a database credential and must not be reachable from forks.
#
# Required repo secret: AIVE_INGEST_DATABASE_URL (scoped aive_ingest role —
# now seven tables incl. mcp_endpoint_probes, still no delete). Nothing else.
# ═══════════════════════════════════════════════════════════════════════════
name: MCP Endpoint Probes

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: probe-mcp-endpoints
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run endpoint probes
        env:
          AIVE_INGEST_DATABASE_URL: ${{ secrets.AIVE_INGEST_DATABASE_URL }}
          AIVE_PROBE_TRIGGER_KIND: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'MANUAL' }}
          AIVE_PROBE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          AIVE_PROBE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          AIVE_PROBE_COLLECTOR_VERSION: ${{ github.sha }}
        run: npx tsx workers/probe-mcp-endpoints.ts
