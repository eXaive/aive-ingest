# ═══════════════════════════════════════════════════════════════════════════
# MCP Registry Ingest — daily full scan of registry.modelcontextprotocol.io
#
# Moved here from the private repo 2026-08-01; cadence unchanged (05:00 UTC).
# Runs the worker directly on the runner and exits non-zero on any ingest
# error or a stale mcp_server_snapshots stream (in-worker freshness tripwire,
# MCP_FRESHNESS_HOURS default 48). The red Actions run IS the alert.
#
# Triggers: schedule + workflow_dispatch ONLY. Never pull_request — this
# workflow holds a database credential and must not be reachable from forks.
#
# Required repo secret: AIVE_INGEST_DATABASE_URL (scoped aive_ingest role —
# six tables, no delete). Nothing else.
# ═══════════════════════════════════════════════════════════════════════════
name: MCP Registry Ingest

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: mcp-registry-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MCP registry scan
        env:
          AIVE_INGEST_DATABASE_URL: ${{ secrets.AIVE_INGEST_DATABASE_URL }}
        run: npx tsx workers/ingest-mcp-registry.ts
