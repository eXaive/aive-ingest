# ═══════════════════════════════════════════════════════════════════════════
# OU1COMES daily category-introduction distribution.
#
# Hourly so the owner's posting-hour control (broadcast_intro_settings.post_hour_utc) takes effect without a
# workflow edit. Each run reconciles prior receipts, then submits at most once per selected destination per UTC
# day, only when the server reports the rotation active, the standing authorization on, today's cycle approved
# and the posting hour reached. The server's atomic begin enforces all of it again, plus the shared 3/day
# account capacity. No generation, no backfill, no retries of uncertain submissions.
#
# Inert unless repository variable BROADCAST_INTRO_DISTRIBUTION == '1'.
# Triggers: schedule + workflow_dispatch ONLY. Never pull_request.
# ═══════════════════════════════════════════════════════════════════════════
name: Broadcast Intro Distribution

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: broadcast-intro-distribution
  cancel-in-progress: false

jobs:
  distribute:
    if: vars.BROADCAST_INTRO_DISTRIBUTION == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # X needs the verified 720p portrait derivative; without FFmpeg the X destination is skipped for the day.
      - name: Prepare FFmpeg for X
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Distribute today's introduction
        env:
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          AIVE_CRON_SECRET: ${{ secrets.AIVE_CRON_SECRET }}
          AIVE_BASE_URL: ${{ secrets.AIVE_BASE_URL }}
          BROADCAST_INTRO_DISTRIBUTION: ${{ vars.BROADCAST_INTRO_DISTRIBUTION }}
        run: npx tsx workers/broadcast-intro-distribution.ts
